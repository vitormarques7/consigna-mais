services:
  bank-mocks:
    build:
      context: .
      target: bank-mocks
    environment:
      BANK_A_MODE: ${BANK_A_MODE:-normal}
      BANK_B_MODE: ${BANK_B_MODE:-normal}
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
  api:
    build:
      context: .
      target: api
    environment:
      BANK_BASE_URL: http://bank-mocks:4001
      BANK_TIMEOUT_MS: 3000
    depends_on:
      bank-mocks:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
  web:
    build:
      context: .
      target: web
    ports:
      - '8080:8080'
    depends_on:
      api:
        condition: service_healthy
